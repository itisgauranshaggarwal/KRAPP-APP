<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="KRAPP - a simple, friendly chat app. Chat 1:1 with friends, no noise."
    />
    <title>KRAPP</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        try {
          var mode = localStorage.getItem('krapp.theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
